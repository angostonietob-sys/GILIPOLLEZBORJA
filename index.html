<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bocina Silla</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      text-align: center;
      justify-content: space-between;
      padding: 12px;
      box-sizing: border-box;
    }
    #estado {
      font-size: 1.1rem;
      padding: 10px;
      background: #222;
      border-radius: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      flex-grow: 1;
      margin: 10px 0;
    }
    button {
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      color: white;
      touch-action: manipulation;
    }
    #btn-pito { background: #007acc; }
    #btn-bocina { background: #e65100; }
    #btn-camaro { background: #fbc02d; color: #111; }
    #btn-frase { background: #7b1fa2; }
    
    .panel-control {
      display: flex;
      gap: 10px;
      height: 60px;
    }
    #btn-parar {
      background: #d32f2f;
      flex: 2;
    }
    #btn-pantalla {
      background: #333;
      flex: 1;
      font-size: 0.9rem;
    }
    .negro {
      background: #000 !important;
      color: #000 !important;
    }
    .negro .grid, .negro #estado, .negro .panel-control {
      visibility: hidden;
    }
  </style>
</head>
<body>

  <div id="estado">Toca la pantalla para activar</div>

  <div class="grid">
    <button id="btn-pito" onclick="sonar('pito')">PITA<br><small>(Pitido)</small></button>
    <button id="btn-bocina" onclick="sonar('bocina')">BOCINA<br><small>(Bocina)</small></button>
    <button id="btn-camaro" onclick="sonar('camaro')">MOTOR<br><small>(Deportivo)</small></button>
    <button id="btn-frase" onclick="sonar('frase')">QUITA<br><small>(De una puta vez)</small></button>
  </div>

  <div class="panel-control">
    <button id="btn-parar" onclick="pararTodo()">⏹️ PARAR TODO</button>
    <button id="btn-pantalla" onclick="pantallaNegra()">Pantalla Negra</button>
  </div>

  <!-- Tus audios webm de la carpeta -->
  <audio id="snd-pito" src="pitido.webm" preload="auto"></audio>
  <audio id="snd-bocina" src="bocina.webm" preload="auto"></audio>
  <audio id="snd-camaro" src="deportivo.webm" preload="auto"></audio>
  <audio id="snd-frase" src="de una puta vez.webm" preload="auto"></audio>

  <script>
    const estado = document.getElementById('estado');
    const audios = document.querySelectorAll('audio');
    let microActivo = false;
    let micro = null;

    function pararTodo() {
      audios.forEach(a => {
        a.pause();
        a.currentTime = 0;
      });
      microActivo = false;
      if (micro) {
        try { micro.stop(); } catch(e) {}
      }
      estado.innerText = "🛑 DETENIDO (Toca la pantalla para reanudar)";
    }

    function sonar(id) {
      audios.forEach(a => {
        a.pause();
        a.currentTime = 0;
      });
      const audio = document.getElementById('snd-' + id);
      if (audio) {
        audio.play().catch(e => console.log('Error de audio:', e));
      }
    }

    const Reconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!Reconocimiento) {
      estado.innerText = "Navegador sin soporte de voz (usa Chrome)";
    } else {
      micro = new Reconocimiento();
      micro.lang = 'es-ES';
      micro.continuous = true;
      micro.interimResults = true;

      micro.onresult = (evento) => {
        for (let i = evento.resultIndex; i < evento.results.length; ++i) {
          const texto = evento.results[i][0].transcript.toLowerCase();
          estado.innerText = "Escuchado: " + texto;

          if (texto.includes('para') || texto.includes('stop') || texto.includes('silencio')) {
            pararTodo();
            return;
          }

          if (texto.includes('pita') || texto.includes('pitido') || texto.includes('paso')) {
            sonar('pito');
          } else if (texto.includes('bocina') || texto.includes('sirena')) {
            sonar('bocina');
          } else if (texto.includes('motor') || texto.includes('deportivo') || texto.includes('camaro')) {
            sonar('camaro');
          } else if (texto.includes('quita') || texto.includes('fuera') || texto.includes('cojones')) {
            sonar('frase');
          }
        }
      };

      micro.onend = () => {
        if (microActivo) {
          try { micro.start(); } catch(e) {}
        }
      };

      window.addEventListener('click', (e) => {
        if (e.target.id === 'btn-parar') return;
        if (!microActivo) {
          microActivo = true;
          try {
            micro.start();
            estado.innerText = "🎤 Micro activo y escuchando...";
          } catch(e) {}
        }
      });
    }

    function pantallaNegra() {
      document.body.classList.toggle('negro');
    }
  </script>
</body>
</html>
